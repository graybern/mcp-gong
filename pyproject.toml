[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gong-mcp-server"
version = "0.1.0"
description = "Local stdio MCP server exposing Gong call-list and transcript-download tools"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
gong-mcp-server = "gong_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gong_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
